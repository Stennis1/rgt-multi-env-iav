name: Apply on Merge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    strategy:
      matrix:
        environment: [staging, production]
      max-parallel: 1 # apply staging fully before touching production
    runs-on: ubuntu-latest
    # This ties the job to a GitHub Environment with "Required reviewers"
    # configured in repo settings. The job PAUSES here until an approver
    # clicks approve - this is the human-review gate. It only exists on this
    # workflow (triggered by push to main), never on the PR-plan workflow, so
    # `apply` can never run against a PR.
    environment:
      name: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.0"

      # MinIO started directly with `docker run`, not GitHub Actions'
      # `services:` block - `services:` has no way to pass a container
      # command, and minio/minio's default CMD is just `minio` with no
      # subcommand (prints usage and exits), not `server /data`. Same
      # invocation as `make minio-up` locally.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data

      - name: Install mc (MinIO client)
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: Bootstrap state bucket
        run: MINIO_ENDPOINT=http://localhost:9000 ./scripts/bootstrap-backend.sh

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: terraform apply
        working-directory: environments/${{ matrix.environment }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform apply -auto-approve
