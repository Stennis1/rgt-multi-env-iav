name: PR - Validate & Plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    strategy:
      matrix:
        environment: [staging, production]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.0"

      # MinIO started directly with `docker run`, not GitHub Actions'
      # `services:` block - `services:` has no way to pass a container
      # command, and minio/minio's default CMD is just `minio` with no
      # subcommand (prints usage and exits), not `server /data`. Same
      # invocation as `make minio-up` locally.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data

      - name: Install mc (MinIO client)
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: Bootstrap state bucket
        run: MINIO_ENDPOINT=http://localhost:9000 ./scripts/bootstrap-backend.sh

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false
          terraform validate

      - name: tfsec (static analysis)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.3
        with:
          working_directory: environments/${{ matrix.environment }}

      - name: terraform init (real backend)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: terraform plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform plan -no-color -out=tfplan.binary | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const env = "${{ matrix.environment }}";
            const plan = fs.readFileSync(`environments/${env}/plan_output.txt`, 'utf8').slice(0, 60000);
            const body = `#### Terraform Plan - \`${env}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
